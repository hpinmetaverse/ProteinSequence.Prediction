# ──────────────────────────────────────────────────────────────────────────────
# Bi-RNN Baseline — Hyperparameter Configuration
# ──────────────────────────────────────────────────────────────────────────────
# Usage: configs/bi_rnn_config.yaml
# Loaded by: scripts/train.py --model bi_rnn --config configs/bi_rnn_config.yaml

model:
  name: "BiRNN"
  # input_dim = 21 when using CSV datasets (one-hot only, no PSSM)
  # input_dim = 42 when using CB513.npy (one-hot + PSSM)
  input_dim: 21          # Set to match your chosen dataset (CSV=21, NPY=42)
  embed_dim: 128         # Linear projection dimension before RNN
  hidden_dim: 256        # RNN hidden units per direction (total = 512)
  num_layers: 1          # Single-layer bidirectional RNN (baseline)
  num_q8_classes: 8      # Q8 secondary structure classes
  dropout: 0.3           # Dropout after embedding and after RNN
  bidirectional: true    # Use both N→C and C→N directions

training:
  learning_rate: 0.001        # Adam initial learning rate
  weight_decay: 0.00001       # L2 regularization (Adam weight_decay)
  max_epochs: 50              # Maximum number of training epochs
  batch_size: 32              # Proteins per batch
  grad_clip_max_norm: 1.0     # Gradient clipping max L2 norm
  early_stopping_patience: 10 # Stop if val Q3 doesn't improve for N epochs

  lr_scheduler:
    type: "ReduceLROnPlateau"
    mode: "max"               # Maximize validation Q3 accuracy
    factor: 0.5               # Multiply LR by this on plateau
    patience: 3               # Wait N epochs before reducing LR

  loss:
    q8_loss_weight: 1.0       # Weight for primary Q8 CrossEntropy loss
    q3_loss_weight: 0.0       # No auxiliary Q3 head in Bi-RNN baseline
    label_pad_value: -1       # CrossEntropyLoss ignore_index

data:
  train_path: "data/cullpdb_pc25_ref2016.npy"
  test_path: "data/cb513.npy"
  train_fraction: 0.8         # 80% train, 20% validation from CullPDB
  seed: 42                    # Random seed for reproducible split
  num_workers: 4              # DataLoader worker processes
  pin_memory: true            # Pin memory for GPU transfer

checkpointing:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  save_best_only: true        # Save only when val Q3 improves
